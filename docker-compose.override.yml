services:

  anitrack:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/code
      - anitrack_venv:/code/.venv  # чтобы бинд-маунт не перекрывал venv, собранный в образе
    environment:
      - DEBUG=True
    ports:
      - '8000:8000'
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  anitrack_venv: