name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.ci .env

      - name: Start containers
        run: docker compose up -d --build --wait

      - name: Start database
        run: docker compose --env-file .env up -d anitrack_db

      - name: Django check
        run: docker compose exec -T anitrack uv run python manage.py check

      - name: Run tests
        run: docker compose exec -T anitrack uv run pytest

      - name: Stop containers
        if: always()
        run: docker compose down