services:
  anitrack:
    build: .
    container_name: anitrack
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn anitrack.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/code
      - static_volume:/vol/static   # ← общий том со статикой
      - media_volume:/vol/media     # ← общий том с медиа
    ports:
      - '8000:8000'
    env_file:
      - .env
    depends_on:
      - anitrack_db

  anitrack_db:
    image: postgres:16
    container_name: anitrack_db
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    build: ./frontend
    container_name: frontend

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html
      - static_volume:/vol/static   # ← тот же том что у Django
      - media_volume:/vol/media     # ← тот же том что у Django
    depends_on:
      - anitrack
      - frontend

volumes:
  postgres_data:
  static_volume:    # ← новый
  media_volume:     # ← новый