services:

  # ── 1. Сборка React-фронтенда ─────────────────────────────────
  frontend:
    build:
      context: ./frontend          # папка с package.json и vite/CRA конфигом
      dockerfile: Dockerfile       # multi-stage Dockerfile
    volumes:
      - frontend_dist:/app/dist    # после сборки dist оказывается в именованном volume
    # Контейнер запускает npm run build и сразу завершается чтобы наполнить volume.

  # ── 2. Backend Django ─────────────────────────────────────────
  anitrack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anitrack
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn anitrack.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/code
      - static_volume:/vol/static # ← общий том со статикой
      - media_volume:/vol/media  # ← общий том с медиа
    env_file:
      - .env
    depends_on:
      - anitrack_db

  # ── 3. База данных ────────────────────────────────────────────
  anitrack_db:
    image: postgres:16
    container_name: anitrack_db
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── 4. Nginx ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro   # ← читает собранный React
      - static_volume:/vol/static:ro
      - media_volume:/vol/media:ro
    depends_on:
      - frontend
      - anitrack

volumes:
  postgres_data:
  static_volume:
  media_volume:
  frontend_dist: