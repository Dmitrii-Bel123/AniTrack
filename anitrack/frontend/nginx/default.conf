server {
    listen 80;
    charset utf-8;

    # ── API → Django ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://anitrack:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Django Admin ──────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://anitrack:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Статика Django (CSS/JS для /admin/) ──────────────────
    location /static/ {
        alias /vol/static/;
    }

    # ── Media-файлы ──────────────────────────────────────────
    location /media/ {
        alias /vol/media/;
    }

    # ── React SPA ─────────────────────────────────────────────
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}