services:
  # ── Backend Django ─────────────────────────────────────────
  anitrack:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anitrack
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn anitrack.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_volume:/vol/static # ← общий том со статикой
      - media_volume:/vol/media  # ← общий том с медиа
    env_file:
      - .env
    depends_on:
      - anitrack_db

  # ── База данных ────────────────────────────────────────────
  anitrack_db:
    image: postgres:16
    container_name: anitrack_db
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE}", "--quiet"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Nginx + Frontend ───────────────────────────────────────
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web
    ports:
      - "80:80"
    volumes:
      - static_volume:/vol/static:ro
      - media_volume:/vol/media:ro
    depends_on:
      - anitrack
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume: